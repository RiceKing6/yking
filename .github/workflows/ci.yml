name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # 允许在 GitHub 页面手动触发

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yking (editable)
        run: python -m pip install -e .

      - name: Run test suites (no API key needed)
        run: |
          python tests/test_smoke.py
          python tests/test_plan.py
          python tests/test_parallel.py
          python tests/test_stream.py
          python tests/test_memory.py
          python tests/test_multi_agent.py
